name = "mcp-skeleton"
main = "dist/entrypoints/worker.js"
compatibility_date = "2026-03-04"
compatibility_flags = ["nodejs_compat"]

# KV namespace for token and cache storage
# Run: wrangler kv:namespace create "SKELETON_KV"
# Then update the id below with the output
[[kv_namespaces]]
binding = "SKELETON_KV"
id = "YOUR_KV_NAMESPACE_ID"

# Staging environment
[env.staging]
name = "mcp-skeleton-staging"
[[env.staging.kv_namespaces]]
binding = "SKELETON_KV"
id = "YOUR_STAGING_KV_NAMESPACE_ID"
